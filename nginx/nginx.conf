events {
    worker_connections 1024;
}

http {
    upstream frontend_app {
        server frontend:8080;
    }

    upstream mediamtx_hls {
        server mediamtx:8888;
    }

    upstream mediamtx_webrtc {
        server mediamtx:8889;
    }

    server {
        listen 80;
        server_name _;

        # Не превращать относительные редиректы в абсолютные (сохраняет внешний порт :8000 за роутером)
        absolute_redirect off;

        # Проксирование HLS-потоков MediaMTX (/hls/live/{slug}/index.m3u8 -> mediamtx:8888/live/{slug}/index.m3u8)
        location /hls/ {
            rewrite ^/hls/(.*) /$1 break;
            proxy_pass http://mediamtx_hls;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_redirect / /hls/;
            proxy_cookie_path / /hls/;
            proxy_buffering off;
        }

        # Задел под WebRTC WHEP (/media/live/{slug}/whep -> mediamtx:8889/live/{slug}/whep)
        location /media/ {
            rewrite ^/media/(.*) /$1 break;
            proxy_pass http://mediamtx_webrtc;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        # Фронтенд Blazor BFF (SSR, WASM статика, /auth/* и /api/* через YARP)
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
